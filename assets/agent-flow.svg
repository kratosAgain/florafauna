<svg width="900" height="740" viewBox="0 0 900 740" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Flora Fauna agent flow</title>
  <desc id="desc">A Giver agent and a Mover agent connect through a neutral Judge agent, producing a visible decision trail.</desc>
