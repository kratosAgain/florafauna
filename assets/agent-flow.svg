  <circle cx="224" cy="202" r="108" fill="#E8F0DA" stroke="#94B86D" stroke-width="4"/>
  <circle cx="676" cy="202" r="108" fill="#FFF4D6" stroke="#D8AA42" stroke-width="4"/>
  <circle cx="450" cy="558" r="76" fill="#15211D"/>
  <path d="M312 238C356 262 388 289 410 316" stroke="#2C7652" stroke-width="12" stroke-linecap="round"/>
  <path d="M588 238C544 262 512 289 490 316" stroke="#2C7652" stroke-width="12" stroke-linecap="round"/>
  <path d="M450 480V518" stroke="#2C7652" stroke-width="12" stroke-linecap="round"/>
