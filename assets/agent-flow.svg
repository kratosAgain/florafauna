  <text x="676" y="228" text-anchor="middle" fill="#53645D" font-family="Arial, sans-serif" font-size="20">Agent</text>
  <text x="450" y="336" text-anchor="middle" fill="#15211D" font-family="Arial, sans-serif" font-size="34" font-weight="700">Judge</text>
  <text x="450" y="378" text-anchor="middle" fill="#53645D" font-family="Arial, sans-serif" font-size="21">validates terms</text>
  <text x="450" y="552" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Visible</text>
  <text x="450" y="584" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Decision Trail</text>
